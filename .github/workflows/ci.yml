name: CI Verification & Quality Assurance

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    name: Formulation, Processor & Algorithmic Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check formulation and baseline consistency
        run: |
          python tests/check_formulation.py

      - name: Run complete pytest test suite
        run: |
          pytest tests/ -v

      - name: Validate frozen Processor D against official toolkit
        run: |
          python -c "
          import json
          from qff_phase2 import validate_processor_d
          with open('processors/processor_D.json') as f:
              d = json.load(f)
          errs = validate_processor_d(d, 9)
          if errs:
              print('Validation FAILED:', errs)
              exit(1)
          print('Processor D PASSES all official criteria with 0 errors.')
          "
